name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App Archive
        run: |
          mkdir -p app-output
          echo "Building Layal Folw App"

      - name: Create Dummy APK for TWA
        uses: jupyterlab/setup-git@v1

      - name: Generate PWA APK
        uses: anticrm/action-pwa-to-apk@master
        with:
          url: https://layalfolw.vercel.app
          name: LayalFolw
        continue-on-error: true

      - name: Package Web Source as APK Zip
        run: |
          zip -r LayalFolw-Source-APK.zip . -x ".git/*" ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LayalFolw-App-Files
          path: LayalFolw-Source-APK.zip
