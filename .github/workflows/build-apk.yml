name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install PWA to APK Tool
        run: npm install -g pwa-to-apk

      - name: Generate APK File
        run: |
          npx pwa-to-apk --url https://layalfolw.vercel.app --name LayalFolw --out ./LayalFolw.apk || true

      - name: Create Zip Package
        run: |
          mkdir -p output
          zip -r output/LayalFolw-App.zip . -x ".git/*" ".github/*"

      - name: Upload APK Package
        uses: actions/upload-artifact@v3
        with:
          name: LayalFolw-APK-File
          path: output/LayalFolw-App.zip
