<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>layal folw – تسجيل الدخول</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  
  body {
    font-family: 'Cairo', sans-serif;
    background-color: #e6ecf5;
    color: #334155;
  }

  /* Embossed / Neumorphic Effects */
  .embossed-card {
    background: #e6ecf5;
    box-shadow: 20px 20px 60px #c4c9d1, -20px -20px 60px #ffffff;
    border-radius: 32px;
  }

  .embossed-input {
    background: #e6ecf5;
    box-shadow: inset 6px 6px 12px #c8ced8, inset -6px -6px 12px #ffffff;
    border-radius: 20px;
    border: none;
    outline: none;
    color: #1e293b;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .embossed-input:focus {
    box-shadow: inset 8px 8px 16px #c8ced8, inset -8px -8px 16px #ffffff;
  }

  .embossed-btn {
    background: #e6ecf5;
    box-shadow: 8px 8px 18px #c8ced8, -8px -8px 18px #ffffff;
    border-radius: 20px;
    color: #2563eb;
    font-weight: 700;
    transition: all 0.15s ease;
  }

  .embossed-btn:active {
    box-shadow: inset 5px 5px 10px #c8ced8, inset -5px -5px 10px #ffffff;
    transform: scale(0.98);
  }

  .embossed-icon {
    background: #e6ecf5;
    box-shadow: 8px 8px 16px #c8ced8, -8px -8px 16px #ffffff;
  }

  .embossed-circle-btn {
    background: #e6ecf5;
    box-shadow: 5px 5px 10px #c8ced8, -5px -5px 10px #ffffff;
    transition: all 0.2s ease;
  }
  .embossed-circle-btn:active {
    box-shadow: inset 3px 3px 6px #c8ced8, inset -3px -3px 6px #ffffff;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[360px] embossed-card p-8 text-center relative">
  <!-- Top Icon -->
  <div class="w-16 h-16 mx-auto mb-4 rounded-full embossed-icon flex items-center justify-center text-amber-400 text-2xl">
    ✨
  </div>

  <!-- Title & Subtitle -->
  <h1 id="title" class="text-2xl font-bold text-slate-800">إنشاء حساب</h1>
  <p id="subtitle" class="text-xs text-slate-400 mt-1 mb-6">ابدأ رحلتك معنا اليوم</p>

  <form id="authForm" class="space-y-4" onsubmit="return false;">
    <!-- Full Name (Only for Signup) -->
    <div id="nameWrap" class="text-right">
      <label class="block text-xs font-semibold text-blue-600 mb-1 mr-2">الاسم الكامل</label>
      <input id="name" type="text" class="w-full h-12 px-5 embossed-input" placeholder="الاسم الكامل">
    </div>

    <!-- Email Address -->
    <div class="text-right">
      <label class="block text-xs font-semibold text-blue-600 mb-1 mr-2">البريد الإلكتروني</label>
      <input id="email" type="email" required dir="ltr" class="w-full h-12 px-5 embossed-input" placeholder="name@example.com">
    </div>

    <!-- Password -->
    <div class="text-right">
      <label class="block text-xs font-semibold text-blue-600 mb-1 mr-2">كلمة السر</label>
      <input id="password" type="password" required dir="ltr" class="w-full h-12 px-5 embossed-input" placeholder="••••••••">
    </div>

    <!-- Error Message -->
    <p id="errMsg" class="text-xs text-red-500 min-h-[16px] text-center"></p>

    <!-- Submit Button -->
    <button id="submitBtn" class="w-full h-14 mt-2 embossed-btn text-sm">
      إنشاء حساب
    </button>
  </form>

  <!-- Divider -->
  <div class="relative my-6 flex items-center justify-center">
    <div class="border-t border-slate-300 w-full"></div>
    <span class="bg-[#e6ecf5] px-3 text-[11px] text-slate-400 font-medium absolute">أو</span>
  </div>

  <!-- Google Sign-In Button -->
  <button id="googleBtn" type="button" class="w-full h-12 embossed-btn flex items-center justify-center gap-3 text-xs font-bold text-slate-700 hover:text-blue-600 transition">
