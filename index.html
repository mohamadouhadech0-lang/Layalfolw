<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم - layal folw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:#e6ecf5;color:#0f172a}
html.dark body{background:#0b1120;color:#e2e8f0}
.sb{transition:width .25s,transform .25s}
.hide-t .lbl{display:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-right-color:#a855f7;animation:spin .8s linear infinite}
.brandtxt{font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:.6px;background:linear-gradient(90deg,#6366f1,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.busy{opacity:.55;pointer-events:none;transition:opacity .2s}

/* Neumorphism / Embossed Styles */
.embossed-card {
  background: #e6ecf5;
  box-shadow: 20px 20px 60px #c4c9d1, -20px -20px 60px #ffffff;
  border-radius: 32px;
}
html.dark .embossed-card {
  background: #0f172a;
  box-shadow: 15px 15px 35px #060a12, -15px -15px 35px #182442;
}
.embossed-input {
  background: #e6ecf5;
  box-shadow: inset 5px 5px 10px #c8ced8, inset -5px -5px 10px #ffffff;
  border-radius: 16px;
  border: none;
  outline: none;
  transition: all 0.2s ease;
}
html.dark .embossed-input {
  background: #0f172a;
  box-shadow: inset 4px 4px 8px #060a12, inset -4px -4px 8px #182442;
}
.embossed-input:focus {
  box-shadow: inset 7px 7px 12px #bc2e8, inset -7px -7px 12px #ffffff;
}
html.dark .embossed-input:focus {
  box-shadow: inset 6px 6px 12px #04070d, inset -6px -6px 12px #1a2747;
}
.embossed-btn {
  background: #e6ecf5;
  box-shadow: 6px 6px 14px #c8ced8, -6px -6px 14px #ffffff;
  border-radius: 16px;
  transition: all 0.15s ease;
}
html.dark .embossed-btn {
  background: #0f172a;
  box-shadow: 6px 6px 14px #060a12, -6px -6px 14px #182442;
}
.embossed-btn:active {
  box-shadow: inset 4px 4px 8px #c8ced8, inset -4px -4px 8px #ffffff;
  transform: scale(0.98);
}
html.dark .embossed-btn:active {
  box-shadow: inset 4px 4px 8px #060a12, inset -4px -4px 8px #182442;
}
.embossed-icon, .embossed-circle-btn {
  background: #e6ecf5;
  box-shadow: 6px 6px 12px #c8ced8, -6px -6px 12px #ffffff;
}
html.dark .embossed-icon, html.dark .embossed-circle-btn {
  background: #0f172a;
  box-shadow: 6px 6px 12px #060a12, -6px -6px 12px #182442;
}

@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
</head>
<body class="min-h-screen">

<!-- ========== AUTH (Neumorphic Embossed Design) ========== -->
<section id="auth" class="min-h-screen grid place-items-center p-4 bg-[#e6ecf5] dark:bg-[#0b1120]">
  <div class="w-full max-w-[380px] embossed-card p-8 text-center relative transition-all duration-300">
    <div id="cardLoader" class="hidden mb-5" role="status" aria-live="polite">
      <div class="flex items-center justify-center gap-3"><span class="spin"></span><span class="brandtxt">layal folw</span></div>
    </div>
    
    <div id="authBody">
      <!-- أيقونة الشعار العلوية -->
      <div class="w-16 h-16 mx-auto mb-3 rounded-full embossed-icon flex items-center justify-center text-amber-400 text-2xl">
        ✨
      </div>

      <div class="flex items-center justify-between mb-1">
        <h1 class="text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">layal folw</h1>
        <button class="themeBtn rounded-full w-9 h-9 grid place-items-center embossed-circle-btn text-slate-600 dark:text-slate-300" aria-label="تبديل الوضع">🌓</button>
      </div>
      <p class="text-xs text-slate-400 dark:text-slate-500 mb-5 text-right">أهلاً بك، ابدأ رحلتك معنا اليوم</p>

      <!-- التبديل بين الدخول والتسجيل -->
      <div class="grid grid-cols-2 rounded-2xl p-1.5 mb-6 text-sm font-semibold gap-2 embossed-input">
        <button id="tabIn" class="py-2.5 rounded-xl bg-[#e6ecf5] dark:bg-slate-800 shadow text-indigo-600 dark:text-indigo-400 transition">تسجيل الدخول</button>
        <button id="tabUp" class="py-2.5 rounded-xl text-slate-500 dark:text-slate-400 transition">إنشاء حساب</button>
      </div>

      <form id="authForm" class="space-y-4" novalidate>
        <div id="nameWrap" class="text-right">
          <label class="block text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 mb-1 mr-2">الاسم الكامل</label>
          <input id="name" class="hidden w-full h-12 px-4 embossed-input text-slate-700 dark:text-slate-200 text-sm" placeholder="الاسم الكامل">
        </div>

        <div class="text-right">
          <label class="block text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 mb-1 mr-2">البريد الإلكتروني</label>
          <input id="email" type="email" class="w-full h-12 px-4 embossed-input text-slate-700 dark:text-slate-200 text-sm" dir="ltr" placeholder="name@example.com">
        </div>

        <div class="text-right">
          <label class="block text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 mb-1 mr-2">كلمة المرور</label>
          <div class="relative">
            <input id="pass" type="password" class="w-full h-12 px-4 pl-10 embossed-input text-slate-700 dark:text-slate-200 text-sm" dir="ltr" placeholder="••••••••">
            <button type="button" id="eye" class="absolute left-2 top-3 w-8 h-8 opacity-70 text-slate-600 dark:text-slate-300" aria-label="إظهار">👁</button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <p id="err" class="text-xs text-red-500 min-h-[16px] text-right flex-1"></p>
          <button type="button" id="forgot" class="text-indigo-600 dark:text-indigo-400 hover:underline whitespace-nowrap mr-2">نسيت كلمة المرور؟</button>
        </div>

        <button id="authBtn" class="w-full h-13 mt-2 embossed-btn text-indigo-600 dark:text-indigo-400 font-bold text-sm py-3 rounded-2xl">دخول</button>
      </form>

      <div class="relative my-6 flex items-center justify-center">
        <div class="border-t border-slate-300 dark:border-slate-700 w-full"></div>
        <span class="bg-[#e6ecf5] dark:bg-[#0b1120] px-3 text-[11px] text-slate-400 font-medium absolute">أو تابع عبر</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" id="gBtn" class="social flex items-center justify-center gap-2 h-12 embossed-btn font-semibold text-xs text-slate-700 dark:text-slate-200">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.5 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.4 0-11.7-4-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Google</button>
        <button type="button" id="fbBtn" class="social flex items-center justify-center gap-2 h-12 embossed-btn font-semibold text-xs text-blue-600 dark:text-blue-400">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
          Facebook</button>
      </div>
    </div><!-- /authBody -->
  </div>
</section>

<!-- ========== APP ========== -->
<div id="app" class="hidden min-h-screen">
  <div id="scrim" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>
  <aside id="sb" class="sb fixed top-0 bottom-0 right-0 z-40 w-64 translate-x-full lg:translate-x-0 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 flex flex-col" style="padding-top:env(safe-area-inset-top,0px)">
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-800">
      <span class="lbl text-xl font-extrabold text-indigo-600 dark:text-indigo-400">◆ layal folw</span>
      <button id="collapse" class="hidden lg:grid w-8 h-8 place-items-center rounded hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="طي القائمة">⇆</button>
    </div>
    <nav class="p-3 space-y-1 text-sm font-medium" id="nav"></nav>
    <button id="logout" class="mt-auto m-3 h-10 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center gap-3 px-3"><span>⎋</span><span class="lbl">تسجيل الخروج</span></button>
  </aside>

  <div id="main" class="sb lg:mr-64">
    <header class="sticky z-20 h-16 flex items-center gap-3 px-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800" style="top:env(safe-area-inset-top,0px)">
      <button id="burger" class="lg:hidden w-10 h-10 rounded hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="القائمة">☰</button>
      <input class="hidden sm:block flex-1 max-w-sm h-10 px-4 rounded-full bg-slate-100 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="ابحث…">
      <div class
