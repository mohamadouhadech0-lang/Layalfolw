<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* حماية: منع التحديد والنسخ، مع السماح داخل خانات الإدخال فقط */
*{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important}
input,textarea,[contenteditable="true"]{-webkit-user-select:text!important;-moz-user-select:text!important;-ms-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:#f1f5f9;color:#0f172a}

html.dark body{background:#0b1120;color:#e2e8f0}
.sb{transition:width .25s,transform .25s}
.hide-t .lbl{display:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-right-color:#a855f7;animation:spin .8s linear infinite}
.brandtxt{font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:.6px;background:linear-gradient(90deg,#6366f1,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.busy{opacity:.55;pointer-events:none;transition:opacity .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ===== Login: neon dark style ===== */
html:has(#auth:not(.hidden)) body{background:#070b14}
.lf-bg{background:
  radial-gradient(420px 360px at -8% 58%,rgba(34,224,240,.75),rgba(34,224,240,0) 70%),
  radial-gradient(380px 420px at 108% 62%,rgba(37,99,235,.7),rgba(37,99,235,0) 70%),
  #070b14}
.lf-card{background:linear-gradient(180deg,#10172a,#0c1222);border:1px solid rgba(255,255,255,.06);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.65);color:#e5ecff}
.lf-card .brandtxt{background:linear-gradient(90deg,#22e0f0,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lf-card .spin{border-color:rgba(34,224,240,.2);border-top-color:#22e0f0;border-right-color:#3b82f6}
.lf-title{font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(255,255,255,.25);margin-top:6px}
.lf-sub{font-size:14px;color:#8a97b4;margin-top:6px}
.lf-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:#080d19;box-shadow:inset 3px 3px 8px rgba(0,0,0,.6),inset -2px -2px 6px rgba(255,255,255,.03);margin-bottom:22px}
.lf-tab{height:40px;border-radius:12px;font-size:14px;font-weight:700;color:#7b8aa6;transition:.2s}
.lf-tab.on{background:#16213a;color:#22e0f0;box-shadow:0 0 14px rgba(34,224,240,.18)}
.lf-field{position:relative;margin-bottom:18px}
.lf-field.hidden{display:none}
