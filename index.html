<style>

/* حماية: منع التحديد والنسخ، مع السماح داخل خانات الإدخال فقط */
*{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important}
input,textarea,[contenteditable="true"]{-webkit-user-select:text!important;-moz-user-select:text!important;-ms-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}

html.dark body{background:#0b1120;color:#e2e8f0}

.hide-t .lbl{display:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-right-color:#a855f7;animation:spin .8s linear infinite}
.brandtxt{font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:.6px;background:linear-gradient(90deg,#6366f1,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.busy{opacity:.55;pointer-events:none;transition:opacity .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ===== Login: neon dark style ===== */
html:has(#auth:not(.hidden)) body{background:#070b14}
.lf-bg{background:
  radial-gradient(420px 360px at -8% 58%,rgba(34,224,240,.75),rgba(34,224,240,0) 70%),
  radial-gradient(380px 420px at 108% 62%,rgba(37,99,235,.7),rgba(37,99,235,0) 70%),
  #070b14}
.lf-card{background:linear-gradient(180deg,#10172a,#0c1222);border:1px solid rgba(255,255,255,.06);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.65);color:#e5ecff}
.lf-card .brandtxt{background:linear-gradient(90deg,#22e0f0,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lf-card .spin{border-color:rgba(34,224,240,.2);border-top-color:#22e0f0;border-right-color:#3b82f6}
.lf-title{font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(255,255,255,.25);margin-top:6px}
.lf-sub{font-size:14px;color:#8a97b4;margin-top:6px}
.lf-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:#080d19;box-shadow:inset 3px 3px 8px rgba(0,0,0,.6),inset -2px -2px 6px rgba(255,255,255,.03);margin-bottom:22px}
.lf-tab{height:40px;border-radius:12px;font-size:14px;font-weight:700;color:#7b8aa6;transition:.2s}
.lf-tab.on{background:#16213a;color:#22e0f0;box-shadow:0 0 14px rgba(34,224,240,.18)}
.lf-field{position:relative;margin-bottom:18px}
.lf-field.hidden{display:none}
.lf-field input{width:100%;height:58px;padding:0 18px;border-radius:18px;border:2px solid transparent;background:#0a0f1d;color:#e5ecff;font-size:15px;outline:none;box-shadow:inset 4px 4px 10px rgba(0,0,0,.55),inset -3px -3px 8px rgba(255,255,255,.025);transition:border-color .2s,box-shadow .2s}
.lf-field input.pw{padding-left:50px}
.lf-field input:focus{border-color:#22e0f0;background:#0b1120;box-shadow:0 0 0 3px rgba(34,224,240,.14),0 0 18px rgba(34,224,240,.35)}
.lf-field label{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);transform-origin:right center;color:#6b7a99;font-size:15px;pointer-events:none;transition:.18s;padding:0 6px;border-radius:6px}
.lf-field input:focus+label,.lf-field input:not(:placeholder-shown)+label{top:0;transform:translateY(-50%) scale(.85);background:#0c1222;color:#8a97b4}
.lf-field input:focus+label{color:#22e0f0}
.lf-field input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #0a0f1d inset;-webkit-text-fill-color:#e5ecff}
.lf-eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:#22e0f0;opacity:.8;border-radius:50%}
.lf-link{font-size:13px;color:#22e0f0;white-space:nowrap}
.lf-link:hover{text-decoration:underline}
.lf-btn{width:100%;height:58px;border-radius:18px;background:linear-gradient(90deg,#22e0f0,#8ff3ff);color:#04202a;font-weight:800;font-size:16px;letter-spacing:.06em;box-shadow:0 10px 28px rgba(34,224,240,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.lf-btn:hover{filter:brightness(1.06);box-shadow:0 12px 34px rgba(34,224,240,.5)}
.lf-btn:active{transform:scale(.98)}
.lf-btn:disabled,.lf-social:disabled{opacity:.6;cursor:not-allowed}
.lf-or{display:flex;align-items:center;gap:12px;margin:26px 0 18px;font-size:12px;letter-spacing:.08em;color:#6b7a99}
.lf-or i{flex:1;height:1px;background:rgba(255,255,255,.08)}
.lf-social{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:16px;background:#0a0f1d;border:1px solid rgba(255,255,255,.08);color:#e5ecff;font-weight:700;font-size:14px;box-shadow:4px 4px 10px rgba(0,0,0,.45),-2px -2px 8px rgba(255,255,255,.02);transition:transform .15s,border-color .2s,box-shadow .2s}
.lf-social:hover{transform:translateY(-2px);border-color:rgba(34,224,240,.5);box-shadow:0 0 16px rgba(34,224,240,.2)}

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const root=document.documentElement;

/* ---- Dark mode ---- */
let saved=null; try{saved=localStorage.getItem("theme")}catch(e){}
const setDark=d=>{root.classList.toggle("dark",d);try{localStorage.setItem("theme",d?"dark":"light")}catch(e){}};
setDark(saved?saved==="dark":matchMedia("(prefers-color-scheme: dark)").matches);
$$(".themeBtn").forEach(b=>b.onclick=()=>setDark(!root.classList.contains("dark")));

/* ---- Auth ---- */
let mode="in";
const setMode=m=>{mode=m;
  $("#nameField").classList.toggle("hidden",m==="in");
  $("#authBtn").textContent=m==="in"?"دخول":"إنشاء حساب";
  $("#hTitle").textContent=m==="in"?"أهلاً بعودتك":"إنشاء حساب جديد";
  $("#hSub").textContent=m==="in"?"سجّل الدخول للوصول إلى حسابك":"أنشئ حسابك وابدأ الآن";
  $("#tabIn").className="lf-tab"+(m==="in"?" on":"");
  $("#tabUp").className="lf-tab"+(m==="up"?" on":"");
  $("#err").textContent="";};
$("#tabIn").onclick=()=>setMode("in");$("#tabUp").onclick=()=>setMode("up");
$("#eye").onclick=()=>{const p=$("#pass");p.type=p.type==="password"?"text":"password"};

/* ---- Sidebar ---- */
const items=[["🏠","الرئيسية"],["📊","التحليلات"],["🛒","الطلبات"],["👥","العملاء"],["📦","المنتجات"],["⚙️","الإعدادات"]];
$("#nav").innerHTML=items.map((x,i)=>`<a href="#" class="flex items-center gap-3 h-10 px-3 rounded-lg ${i?"text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800":"bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300"}"><span>${x[0]}</span><span class="lbl">${x[1]}</span></a>`).join("");
let slim=false;
$("#collapse").onclick=()=>{slim=!slim;
  $("#sb").style.width=slim?"4.5rem":"";$("#sb").classList.toggle("hide-t",slim);
  $("#main").style.marginRight=slim?"4.5rem":"";};
const mob=o=>{$("#sb").classList.toggle("translate-x-full",!o);$("#scrim").classList.toggle("hidden",!o)};
$("#burger").onclick=()=>mob(true);$("#scrim").onclick=()=>mob(false);

/* ---- Notifications ---- */
$("#bell").onclick=e=>{e.stopPropagation();$("#notif").classList.toggle("hidden")};
document.addEventListener("click",()=>$("#notif").classList.add("hidden"));

/* ---- Cards ---- */
const cards=[["الإيرادات","$48,290","+12.5%",1,"💰","from-indigo-500 to-violet-500"],["الطلبات","1,284","+8.2%",1,"🛒","from-emerald-500 to-teal-500"],["العملاء الجدد","356","+3.1%",1,"👥","from-amber-500 to-orange-500"],["معدل الإلغاء","2.4%","-0.6%",0,"↩️","from-rose-500 to-pink-500"]];
$("#cards").innerHTML=cards.map(c=>`<div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 hover:shadow-lg hover:-translate-y-0.5 transition flex items-center justify-between">
<div><div class="text-sm text-slate-500">${c[0]}</div><div class="text-2xl font-extrabold mt-1">${c[1]}</div><div class="text-xs mt-1 ${c[3]?"text-emerald-500":"text-rose-500"}" dir="ltr">${c[2]} هذا الأسبوع</div></div>
<div class="w-12 h-12 rounded-xl bg-gradient-to-br ${c[5]} grid place-items-center text-xl">${c[4]}</div></div>`).join("");

/* ---- Orders ---- */
$("#orders").innerHTML=[["أحمد علي","$120","#1042"],["سارة محمد","$86","#1041"],["يوسف خالد","$240","#1040"],["ليلى حسن","$59","#1039"]].map(o=>`<li class="py-3 flex items-center justify-between"><div><div class="font-semibold">${o[0]}</div><div class="text-xs text-slate-500">${o[2]}</div></div><span class="font-bold" dir="ltr">${o[1]}</span></li>`).join("");

/* ---- Chart ---- */
const days=["س","ح","ن","ث","ر","خ","ج"],v=[32,45,38,60,52,74,68];
const W=600,H=220,pad=30,max=80,x=i=>W-pad-i*(W-2*pad)/6,y=n=>H-pad-n/max*(H-2*pad);
const pts=v.map((n,i)=>`${x(i)},${y(n)}`).join(" ");
$("#chart").innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>
${[0,20,40,60,80].map(n=>`<line x1="${pad}" x2="${W-pad}" y1="${y(n)}" y2="${y(n)}" stroke="currentColor" opacity=".1"/>`).join("")}
<polygon points="${x(0)},${H-pad} ${pts} ${x(6)},${H-pad}" fill="url(#g)"/>
<polyline points="${pts}" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="4.5" fill="#6366f1"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="13" fill="currentColor" opacity=".6">${days[i]}</text>`).join("")}`;
</script>
<script>
/* تشخيص: إذا لم يُحمَّل Firebase (مثلاً الصفحة مفتوحة داخل معاينة Claude أو بصيغة file://) تظهر رسالة واضحة */
(function(){
  const warn=()=>{const e=document.getElementById("err");
    if(e)e.textContent="Firebase لم يعمل هنا. افتح الملف من رابط مستضاف (https) وليس من معاينة Claude أو من ملف محلي.";};
  ["gBtn","fbBtn","forgot"].forEach(id=>document.getElementById(id).addEventListener("click",()=>{if(!window.__fbReady)warn()}));
  document.getElementById("authForm").addEventListener("submit",()=>{if(!window.__fbReady)warn()});
  setTimeout(()=>{if(!window.__fbReady)console.warn("Firebase module not loaded")},3000);
})();
</script>

  projectId: "layal-follow",

  messagingSenderId: "850647879566",
  appId: "1:850647879566:web:54e2e67a395f5d56101edf",
  measurementId: "G-KVN372FDCR"
};
const app  = initializeApp(firebaseConfig);
/* الجلسة تُحفظ لتبويب المتصفح فقط (تنتقل بين index و dashboard وتُمحى عند إغلاق التبويب) */
const auth = initializeAuth(app, {
  persistence: browserSessionPersistence,
  popupRedirectResolver: browserPopupRedirectResolver
});
auth.languageCode = "ar";

const $ = s => document.querySelector(s);
const showErr = m => { $("#err").className = "text-sm text-red-500 min-h-[20px]"; $("#err").textContent = m || ""; };

/* 2) رسائل الأخطاء بالعربية */
const ERRORS = {
  "auth/invalid-email": "البريد الإلكتروني غير صالح.",
  "auth/missing-password": "أدخل كلمة المرور.",
  "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل).",
  "auth/email-already-in-use": "هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.",
  "auth/user-not-found": "لا يوجد حساب بهذا البريد.",
  "auth/wrong-password": "كلمة المرور غير صحيحة.",
  "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
  "auth/user-disabled": "هذا الحساب معطّل.",
  "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.",
  "auth/network-request-failed": "تعذّر الاتصال. تحقق من الإنترنت.",
  "auth/popup-blocked": "المتصفح حظر النافذة المنبثقة. اسمح بها ثم أعد المحاولة.",
  "auth/popup-closed-by-user": "أُغلقت نافذة تسجيل الدخول قبل الإكمال.",
  "auth/cancelled-popup-request": "تم إلغاء الطلب السابق. حاول مرة أخرى.",
  "auth/account-exists-with-different-credential": "يوجد حساب بنفس البريد بطريقة دخول أخرى (مثل Google أو البريد). سجّل بها أولاً.",
  "auth/operation-not-allowed": "طريقة الدخول هذه غير مفعّلة في Firebase Console.",
  "auth/web-storage-unsupported": "المتصفح يمنع التخزين اللازم لتسجيل الدخول. فعّل التخزين/ملفات الارتباط ثم حاول مجدداً.",
  "auth/operation-not-supported-in-this-environment": "بيئة التشغيل لا تدعم تسجيل الدخول بهذه الطريقة.",
  "auth/unauthorized-domain": "هذا النطاق غير مضاف في Authorized domains داخل Firebase."
};
const msg = e => ERRORS[e?.code] || "حدث خطأ غير متوقع (" + (e?.code || e?.message || "unknown") + ").";

/* مساعد: تعطيل الأزرار أثناء الطلب */
async function run(btns, fn) {
  showErr("");
  btns.forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { console.error(e); showErr(msg(e)); }
  finally { btns.forEach(b => b.disabled = false); }
}
const allBtns = () => [$("#authBtn"), $("#gBtn"), $("#fbBtn")];

/* مهلة 5 ثوانٍ مع رسالة حالة بعد نجاح التحقق من Firebase */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const POST_LOGIN_DELAY = 5000;   // مدة عرض الدائرة بعد نجاح الدخول (مللي ثانية)
const info = m => { const e = $("#err"); e.className = "text-sm text-emerald-500 min-h-[20px]"; e.textContent = m; };
let busy = false;   // يمنع onAuthStateChanged من فتح اللوحة قبل انتهاء المهلة
const cardLoader=on=>{
  $("#cardLoader").classList.toggle("hidden",!on);
  $("#authBody").classList.toggle("busy",on);
};
async function flow(label, doAuth) {
  busy = true;
  try {
    const user = await doAuth();         // نجاح التحقق من Firebase
    cardLoader(true);                    // الدائرة + الاسم أعلى البطاقة
    await sleep(POST_LOGIN_DELAY);        // مدة العرض قبل الانتقال
    location.href = "dashboard.html";    // الانتقال للوحة
  } finally { busy = false; cardLoader(false); }
}

/* 3+4) Google و Facebook: إعادة توجيه داخل نفس الصفحة (بدون نافذة منبثقة) */
const REDIR_KEY = "lf_oauth_redirect";
async function startRedirect(provider) {
  sessionStorage.setItem(REDIR_KEY, "1");   // علامة: عند العودة نُظهر الدائرة فوراً
  cardLoader(true);
  try { await signInWithRedirect(auth, provider); }   // تنتقل الصفحة كلها إلى Google ثم تعود
  catch (e) { sessionStorage.removeItem(REDIR_KEY); cardLoader(false); throw e; }
}
$("#gBtn").onclick = () => run(allBtns(), () => {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  return startRedirect(p);
});
$("#fbBtn").onclick = () => run(allBtns(), () => {
  const p = new FacebookAuthProvider(); p.addScope("email"); p.addScope("public_profile");
  return startRedirect(p);
});

/* 5) البريد وكلمة المرور (دخول / إنشاء حساب) */
$("#authForm").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("#email").value.trim(), pass = $("#pass").value, name = $("#name").value.trim();
  const signup = typeof mode !== "undefined" && mode === "up";
  if (signup && name.length < 2) return showErr("أدخل اسمك الكامل.");
  if (!/^\S+@\S+\.\S+$/.test(email)) return showErr(ERRORS["auth/invalid-email"]);
  if (pass.length < 6) return showErr(ERRORS["auth/weak-password"]);
  run(allBtns(), () => signup
    ? flow("جاري التسجيل...", async () => {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        return cred.user;
      })
    : flow("جاري الدخول...", async () => (await signInWithEmailAndPassword(auth, email, pass)).user));
});

/* إعادة تعيين كلمة المرور */
$("#forgot").onclick = () => {
  const email = $("#email").value.trim();
  if (!email) return showErr("أدخل بريدك الإلكتروني أولاً ثم اضغط «نسيت كلمة المرور».");
  run(allBtns(), async () => {
    await sendPasswordResetEmail(auth, email);
    showErr("");
    $("#err").className = "text-sm text-emerald-500 min-h-[20px]";
    $("#err").textContent = "أُرسل رابط إعادة التعيين إلى بريدك (تحقق أيضاً من الرسائل غير المرغوبة).";
    setTimeout(() => { $("#err").className = "text-sm text-red-500 min-h-[20px]"; }, 6000);
  });
};

/* 6) عرض بيانات المستخدم (الاسم والصورة) والتوجيه للوحة */
function showUser(user, forcedName) {
  const name = forcedName || user.displayName || (user.email || "مستخدم").split("@")[0];
  $("#uname").textContent = name;
  const av = $("#avatar");
  if (user.photoURL) {
    av.innerHTML = `<img src="${user.photoURL}" alt="" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;
  } else { av.textContent = name.trim()[0] || "م"; }
  $("#auth").classList.add("hidden");
  $("#app").classList.remove("hidden");
}

/* يتابع حالة الدخول (الجلسة في الذاكرة فقط، فلا تُستعاد بعد التحديث) */
onAuthStateChanged(auth, user => {
  if (busy) return;
  if (user) location.replace("dashboard.html");
  else { $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden"); }
});

/* معالجة العودة من Google/Facebook بعد إعادة التوجيه */
(async () => {
  const returning = sessionStorage.getItem(REDIR_KEY) === "1";
  if (returning) { busy = true; cardLoader(true); }   // يمنع ظهور النموذج أو التحويل المبكر
  try {
    const res = await getRedirectResult(auth);
    sessionStorage.removeItem(REDIR_KEY);
    if (res && res.user) {
      cardLoader(true);
      await sleep(POST_LOGIN_DELAY);
      location.href = "dashboard.html";
      return;                                          // busy يبقى true حتى الانتقال
    }
  } catch (e) {
    console.error(e);
    sessionStorage.removeItem(REDIR_KEY);
    showErr(msg(e));
  }
  busy = false; cardLoader(false);
  if (auth.currentUser) location.replace("dashboard.html");   // جلسة قائمة: المتابعة المعتادة
})();

window.__fbReady = true;

/* 7) تسجيل الخروج */
$("#logout").onclick = () => signOut(auth).then(() => { $("#pass").value = ""; showErr(""); }).catch(e => alert(msg(e)));
</script>
</body>
<script>
  (function(){
    var ed=function(e){return /^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||"")};
    ["contextmenu","selectstart","copy","cut","dragstart"].forEach(function(t){
      document.addEventListener(t,function(e){if(!ed(e))e.preventDefault()});
    });
  })();
</script>
