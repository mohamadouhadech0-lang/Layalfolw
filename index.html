<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>layal folw – Account</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
  
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #e6ecf5;
    color: #334155;
  }

  /* Embossed / Neumorphic Effects */
  .embossed-card {
    background: #e6ecf5;
    box-shadow: 20px 20px 60px #c4c9d1, -20px -20px 60px #ffffff;
    border-radius: 32px;
  }

  .embossed-input {
    background: #e6ecf5;
    box-shadow: inset 6px 6px 12px #c8ced8, inset -6px -6px 12px #ffffff;
    border-radius: 20px;
    border: none;
    outline: none;
    color: #1e293b;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .embossed-input:focus {
    box-shadow: inset 8px 8px 16px #be2e8, inset -8px -8px 16px #ffffff;
  }

  .embossed-btn {
    background: #e6ecf5;
    box-shadow: 8px 8px 18px #c8ced8, -8px -8px 18px #ffffff;
    border-radius: 20px;
    color: #2563eb;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }

  .embossed-btn:active {
    box-shadow: inset 5px 5px 10px #c8ced8, inset -5px -5px 10px #ffffff;
    transform: scale(0.98);
  }

  .embossed-icon {
    background: #e6ecf5;
    box-shadow: 8px 8px 16px #c8ced8, -8px -8px 16px #ffffff;
  }

  .embossed-circle-btn {
    background: #e6ecf5;
    box-shadow: 5px 5px 10px #c8ced8, -5px -5px 10px #ffffff;
    transition: all 0.2s ease;
  }
  .embossed-circle-btn:active {
    box-shadow: inset 3px 3px 6px #c8ced8, inset -3px -3px 6px #ffffff;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[360px] embossed-card p-8 text-center relative">
  <!-- Top Icon -->
  <div class="w-16 h-16 mx-auto mb-4 rounded-full embossed-icon flex items-center justify-center text-amber-400 text-2xl">
    ✨
  </div>

  <!-- Title & Subtitle -->
  <h1 id="title" class="text-2xl font-bold text-slate-800 tracking-tight">Create Account</h1>
  <p id="subtitle" class="text-xs text-slate-400 mt-1 mb-6">Start your journey with us</p>

  <form id="authForm" class="space-y-4" onsubmit="return false;">
    <!-- Full Name (Only for Signup) -->
    <div id="nameWrap" class="text-left">
      <label class="block text-[11px] font-semibold text-blue-600 mb-1 ml-2">Full Name</label>
      <input id="name" type="text" class="w-full h-12 px-5 embossed-input" placeholder="nile">
    </div>

    <!-- Email Address -->
    <div class="text-left">
      <label class="block text-[11px] font-semibold text-blue-600 mb-1 ml-2">Email Address</label>
      <input id="email" type="email" required class="w-full h-12 px-5 embossed-input" placeholder="mhatre@example.com">
    </div>

    <!-- Password -->
    <div class="text-left">
      <label class="block text-[11px] font-semibold text-blue-600 mb-1 ml-2">Password</label>
      <input id="password" type="password" required class="w-full h-12 px-5 embossed-input" placeholder="••••••••">
    </div>

    <!-- Error Message -->
    <p id="errMsg" class="text-xs text-red-500 min-h-[16px] text-center"></p>

    <!-- Submit Button -->
    <button id="submitBtn" class="w-full h-14 mt-3 embossed-btn text-xs uppercase tracking-wider">
      CREATE ACCOUNT
    </button>
  </form>

  <!-- Toggle Section -->
  <div class="mt-8 pt-4 flex items-center justify-center gap-3 text-xs text-slate-400">
    <span id="toggleText">Already have an account?</span>
    <button id="toggleBtn" type="button" class="w-8 h-8 rounded-full embossed-circle-btn flex items-center justify-center text-slate-600 font-bold">
      →
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeAuth, browserSessionPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyD38HBchSLBCdSqjnZPL_8MnsOMSuYVQ4Y",
  authDomain: "layal-follow.firebaseapp.com",
  projectId: "layal-follow",
  storageBucket: "layal-follow.firebasestorage.app",
  messagingSenderId: "850647879566",
  appId: "1:850647879566:web:54e2e67a395f5d56101edf",
  measurementId: "G-KVN372FDCR"
});

const auth = initializeAuth(app, { persistence: browserSessionPersistence });

let isSignUp = true;

const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const nameWrap = document.getElementById("nameWrap");
const submitBtn = document.getElementById("submitBtn");
const toggleText = document.getElementById("toggleText");
const toggleBtn = document.getElementById("toggleBtn");
const errMsg = document.getElementById("errMsg");

toggleBtn.onclick = () => {
  isSignUp = !isSignUp;
  errMsg.textContent = "";
  if (isSignUp) {
    title.textContent = "Create Account";
    subtitle.textContent = "Start your journey with us";
    nameWrap.style.display = "block";
    submitBtn.textContent = "CREATE ACCOUNT";
    toggleText.textContent = "Already have an account?";
    toggleBtn.textContent = "→";
  } else {
    title.textContent = "Welcome Back";
    subtitle.textContent = "Sign in to continue";
    nameWrap.style.display = "none";
    submitBtn.textContent = "SIGN IN";
    toggleText.textContent = "Need an account?";
    toggleBtn.textContent = "←";
  }
};

submitBtn.onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const name = document.getElementById("name").value.trim();
  errMsg.textContent = "";

  if (!email || !password) {
    errMsg.textContent = "Please fill in all required fields";
    return;
  }

  try {
    if (isSignUp) {
      if (!name) { errMsg.textContent = "Please enter your full name"; return; }
      const res = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(res.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
    location.replace("dashboard.html");
  } catch (err) {
    errMsg.textContent = "Error: Invalid credentials or user exists.";
  }
};

onAuthStateChanged(auth, user => {
  if (user) location.replace("dashboard.html");
});
</script>
</body>
</html>
