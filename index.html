<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:#f1f5f9;color:#0f172a}
html.dark body{background:#0b1120;color:#e2e8f0}
.sb{transition:width .25s,transform .25s}
.hide-t .lbl{display:none}
</style>
</head>
<body class="min-h-screen">

<!-- ========== AUTH ========== -->
<section id="auth" class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 dark:from-slate-900 dark:via-indigo-950 dark:to-slate-900">
  <div class="w-full max-w-md bg-white/90 dark:bg-slate-900/90 backdrop-blur rounded-2xl shadow-2xl p-7">
    <div class="flex items-center justify-between mb-5">
      <div class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400">◆ لوحتي</div>
      <button class="themeBtn rounded-full w-9 h-9 grid place-items-center bg-slate-100 dark:bg-slate-800" aria-label="تبديل الوضع">🌓</button>
